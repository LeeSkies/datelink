<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>גלגל הזיווגים</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Frank+Ruhl+Libre:wght@400;500;600;700;900&family=Assistant:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --cream:#FFF6F2;
    --cream-deep:#FBEBE4;
    --rose:#F4B9C6;
    --rose-soft:#FBD7DF;
    --rose-deep:#E28BA0;
    --mauve:#7A4258;
    --mauve-soft:#9C6478;
    --azure:#8FD3E8;
    --azure-deep:#5FB4D2;
    --gold:#D9AF6E;
    --gold-light:#F3DFB4;
    --gold-deep:#B98A46;
    --white:#FFFDFB;
    --shadow-rose: rgba(226,139,160,.35);
    --shadow-azure: rgba(95,180,210,.28);
    --spin-duration: 17s;
  }

  *{ box-sizing:border-box; }

  html,body{
    margin:0; padding:0; height:100%;
    background:
      radial-gradient(ellipse 90% 60% at 20% 0%, var(--rose-soft) 0%, transparent 60%),
      radial-gradient(ellipse 80% 55% at 85% 10%, #DCF1F6 0%, transparent 55%),
      radial-gradient(ellipse 70% 60% at 50% 100%, var(--cream-deep) 0%, transparent 60%),
      var(--cream);
    font-family:'Assistant', sans-serif;
    color:var(--mauve);
    overflow-x:hidden;
    min-height:100vh;
  }

  /* ---------- Ambient floating decoration ---------- */
  #ambient{
    position:fixed; inset:0; pointer-events:none; z-index:0; overflow:hidden;
  }
  .drift{
    position:absolute;
    opacity:.55;
    filter: drop-shadow(0 0 6px rgba(255,255,255,.6));
    animation: driftMove linear infinite, driftFade ease-in-out infinite;
    will-change: transform, opacity;
  }
  @keyframes driftMove{
    0%{ transform: translateY(0) translateX(0) rotate(0deg); }
    100%{ transform: translateY(-120vh) translateX(var(--dx, 30px)) rotate(360deg); }
  }
  @keyframes driftFade{
    0%, 100%{ opacity:.15; }
    50%{ opacity:.65; }
  }

  /* ---------- Layout ---------- */
  .page{
    position:relative; z-index:1;
    min-height:100vh;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    padding: 22px 18px;
  }

  .stage{
    width:100%;
    max-width:1320px;
    display:flex;
    justify-content:center;
    align-items:center;
  }

  /* ---------- Wheel area ---------- */
  .wheel-wrap{
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    position:relative;
    padding: 10px;
  }

  .wheel-frame{
    position:relative;
    width: min(88vw, 760px);
    height: min(88vw, 760px);
    display:flex; align-items:center; justify-content:center;
  }

  .glow-ring{
    position:absolute; inset:-30px; border-radius:50%;
    background: conic-gradient(from 0deg, var(--rose) 0deg, var(--azure) 120deg, var(--gold-light) 240deg, var(--rose) 360deg);
    filter: blur(38px); opacity:.45;
    animation: spinGlow 14s linear infinite;
    transition: filter .6s ease, opacity .6s ease;
  }
  @keyframes spinGlow{ to{ transform: rotate(360deg); } }
  .wheel-wrap.is-spinning .glow-ring{
    animation-duration: 1.1s;
    filter: blur(52px);
    opacity: .8;
  }

  .rim{
    position:absolute; inset:-12px; border-radius:50%;
    background: linear-gradient(155deg, var(--gold-light), var(--gold) 45%, var(--gold-deep) 100%);
    box-shadow:
      0 24px 55px -18px rgba(122,66,88,.45),
      inset 0 0 0 3px rgba(255,255,255,.35),
      inset 0 -6px 14px rgba(0,0,0,.12);
  }
  .rim::after{
    content:""; position:absolute; inset:10px; border-radius:50%;
    background: repeating-conic-gradient(rgba(255,255,255,.35) 0deg 2deg, transparent 2deg 9deg);
    opacity:.5;
  }

  canvas#wheel{
    position:relative;
    border-radius:50%;
    box-shadow: 0 0 0 6px var(--white), 0 10px 30px rgba(122,66,88,.25);
    transform: rotate(0deg);
  }
  canvas#wheel.spin-transition{
    transition: transform var(--spin-duration, 16s) cubic-bezier(.11,.68,.1,1);
  }

  .hub{
    position:absolute; top:50%; left:50%; transform:translate(-50%,-50%);
    width: 30%; height:30%;
    border-radius:50%;
    background: radial-gradient(circle at 35% 30%, #fff, var(--white) 55%, var(--cream-deep) 100%);
    display:flex; align-items:center; justify-content:center;
    box-shadow:
      0 0 0 4px var(--gold-light),
      0 0 0 7px var(--gold-deep),
      0 8px 22px rgba(122,66,88,.35);
    z-index:5;
    animation: hubPulse 3.4s ease-in-out infinite;
  }
  @keyframes hubPulse{
    0%,100%{ box-shadow: 0 0 0 4px var(--gold-light), 0 0 0 7px var(--gold-deep), 0 8px 22px rgba(122,66,88,.35); }
    50%{ box-shadow: 0 0 0 4px var(--gold-light), 0 0 0 7px var(--gold-deep), 0 8px 34px rgba(226,139,160,.55); }
  }
  .wheel-wrap.is-spinning .hub{
    animation-duration: .5s;
  }
  .hub img{
    width: 78%;
    height:auto;
    display:block;
    filter: drop-shadow(0 2px 4px rgba(122,66,88,.25));
  }

  .pointer{
    position:absolute; top:-18px; left:50%; transform:translateX(-50%);
    width:46px; height:56px; z-index:6;
    filter: drop-shadow(0 6px 10px rgba(122,66,88,.4));
  }

  /* ---------- Orbit rings: gentle ambient decoration around the wheel ---------- */
  .orbit-field{
    position:absolute;
    inset:0;
    z-index:1;
    pointer-events:none;
  }
  .orbit-ring{
    position:absolute;
    border-radius:50%;
    border:1.5px dashed transparent;
    opacity:.4;
    animation-timing-function:linear;
    animation-iteration-count:infinite;
    transition: opacity .8s ease;
  }
  .orbit-ring::before{
    content:"";
    position:absolute;
    top:-3px; left:50%;
    width:7px; height:7px;
    border-radius:50%;
    transform:translateX(-50%);
    transition: width .5s ease, height .5s ease, box-shadow .5s ease;
  }
  .orbit-ring.ring-1{
    inset:-13%;
    border-color: rgba(226,139,160,.5);
    animation-name:orbitCW;
    animation-duration:46s;
  }
  .orbit-ring.ring-1::before{
    background:var(--rose-deep);
    box-shadow:0 0 10px var(--rose-deep), 0 0 18px var(--rose);
  }
  .orbit-ring.ring-2{
    inset:-24%;
    border-style:dotted;
    border-color: rgba(95,180,210,.45);
    animation-name:orbitCCW;
    animation-duration:63s;
  }
  .orbit-ring.ring-2::before{
    background:var(--azure-deep);
    box-shadow:0 0 10px var(--azure-deep), 0 0 18px var(--azure);
  }
  .orbit-ring.ring-3{
    inset:-35%;
    border-color: rgba(217,175,110,.45);
    animation-name:orbitCW;
    animation-duration:84s;
  }
  .orbit-ring.ring-3::before{
    background:var(--gold-deep);
    box-shadow:0 0 10px var(--gold-deep), 0 0 18px var(--gold-light);
  }
  @keyframes orbitCW{ to{ transform:rotate(360deg); } }
  @keyframes orbitCCW{ to{ transform:rotate(-360deg); } }

  .wheel-wrap.is-spinning .orbit-ring{ opacity:.85; }
  .wheel-wrap.is-spinning .orbit-ring.ring-1{ animation-duration:8s; }
  .wheel-wrap.is-spinning .orbit-ring.ring-2{ animation-duration:12s; }
  .wheel-wrap.is-spinning .orbit-ring.ring-3{ animation-duration:16s; }
  .wheel-wrap.is-spinning .orbit-ring::before{
    width:11px; height:11px;
  }

  /* ---------- Live "under the pointer" readout while spinning ---------- */
  .action-slot{
    margin-top: 26px;
    display:grid;
    place-items:center;
  }
  .action-slot > *{
    grid-area: 1 / 1;
  }
  .pointer-readout{
    display:flex; align-items:center; justify-content:center;
    opacity:0;
    transform: translateY(6px) scale(.95);
    transition: opacity .3s ease, transform .3s ease, visibility .3s ease;
    visibility:hidden;
    pointer-events:none;
  }
  .pointer-readout.show{
    opacity:1;
    transform: translateY(0) scale(1);
    visibility:visible;
  }
  .pointer-readout span{
    font-family:'Frank Ruhl Libre', serif;
    font-weight:700;
    font-size: clamp(18px, 2.6vw, 24px);
    letter-spacing:.02em;
    color: var(--mauve);
    background: linear-gradient(165deg, rgba(255,253,251,.92), rgba(255,246,242,.8));
    border: 1.5px solid rgba(217,175,110,.5);
    padding: 9px 30px;
    border-radius: 100px;
    box-shadow: 0 10px 26px -12px var(--shadow-rose), 0 0 0 1px rgba(255,255,255,.4) inset;
    max-width: 70vw;
    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap;
    direction:rtl;
  }
  .pointer-readout span.tick{
    animation: readoutTick .22s ease;
  }
  @keyframes readoutTick{
    0%{ transform: scale(1.14); color: var(--rose-deep); }
    100%{ transform: scale(1); }
  }

  button{
    font-family:'Assistant', sans-serif;
    font-weight:600;
    font-size:14px;
    border:none;
    border-radius:12px;
    padding:11px 16px;
    cursor:pointer;
    transition: transform .15s ease, box-shadow .15s ease, filter .15s ease;
  }
  button:active{ transform: translateY(1px) scale(.98); }
  button:focus-visible{ outline: 3px solid var(--azure-deep); outline-offset:2px; }

  .spin-btn{
    font-family:'Frank Ruhl Libre', serif;
    font-weight:700;
    font-size:19px;
    letter-spacing:.02em;
    padding: 15px 46px;
    border-radius: 100px;
    color:#fff;
    background: linear-gradient(135deg, var(--rose-deep), var(--gold-deep));
    box-shadow: 0 14px 32px -12px var(--shadow-rose), 0 0 0 1px rgba(255,255,255,.25) inset;
    position:relative;
    overflow:hidden;
    transition: opacity .3s ease, transform .3s ease, visibility .3s ease;
  }
  .spin-btn.is-hidden{
    opacity:0;
    transform: translateY(8px) scale(.92);
    visibility:hidden;
    pointer-events:none;
  }
  .spin-btn::after{
    content:""; position:absolute; inset:0;
    background: linear-gradient(120deg, transparent 30%, rgba(255,255,255,.5) 50%, transparent 70%);
    background-size:200% 100%;
    animation: shine 3.2s linear infinite;
  }
  @keyframes shine{ 0%{background-position:200% 0;} 100%{background-position:-200% 0;} }
  .spin-btn:disabled{ opacity:.5; cursor:not-allowed; }
  .spin-btn:disabled::after{ animation:none; }

  /* ---------- Winner modal ---------- */
  .modal-overlay{
    position:fixed; inset:0; z-index:50;
    background: rgba(122,66,88,.35);
    backdrop-filter: blur(6px);
    display:flex; align-items:center; justify-content:center;
    opacity:0; pointer-events:none;
    transition: opacity .35s ease;
  }
  .modal-overlay.show{ opacity:1; pointer-events:auto; }

  .modal{
    background: linear-gradient(165deg, #fff, var(--cream));
    border-radius:26px;
    padding: 40px 44px 36px;
    text-align:center;
    max-width: 90vw;
    width: 380px;
    box-shadow: 0 30px 70px -20px rgba(122,66,88,.5);
    border: 1px solid rgba(217,175,110,.4);
    transform: scale(.85) translateY(20px);
    transition: transform .4s cubic-bezier(.2,.9,.25,1.2);
    position:relative;
  }
  .modal-overlay.show .modal{ transform: scale(1) translateY(0); }

  .modal .label{
    font-size:13px; letter-spacing:.14em; text-transform:uppercase;
    color:var(--gold-deep); font-weight:700; margin-bottom:10px;
  }
  .modal .winner-name{
    font-family:'Frank Ruhl Libre', serif;
    font-size: clamp(30px, 8vw, 40px);
    font-weight:800;
    color:var(--mauve);
    margin: 4px 0 8px;
    text-shadow: 0 4px 20px rgba(226,139,160,.35);
  }
  .modal .winner-phone{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:8px;
    font-size: 16px;
    font-weight: 600;
    letter-spacing: .03em;
    color: var(--gold-deep);
    margin: 0 0 22px;
    cursor: pointer;
    user-select: none;
    -webkit-user-select: none;
    transition: color .25s ease;
  }
  .modal .winner-phone .copy-ico{
    width: 15px; height: 15px; fill: currentColor;
    opacity: .65;
    transition: transform .15s ease, opacity .25s ease;
  }
  .modal .winner-phone:active .ico-copy{ transform: scale(.8); } /* press feedback */
  .modal .winner-phone .ico-check{ display:none; }
  .modal .winner-phone.copied{ color: var(--mauve); }
  .modal .winner-phone.copied .ico-copy{ display:none; }
  .modal .winner-phone.copied .ico-check{ display:block; opacity:1; animation: pop .3s ease; }
  @keyframes pop{ 0%{ transform: scale(.4); } 70%{ transform: scale(1.25); } 100%{ transform: scale(1); } }
  .modal button{
    background: linear-gradient(135deg, var(--rose-deep), var(--rose));
    color:#fff; padding:12px 30px; border-radius:100px; font-size:15px; font-weight:600;
    box-shadow: 0 10px 24px -8px var(--shadow-rose);
  }

  #confetti-layer{
    position:fixed; inset:0; z-index:60; pointer-events:none; overflow:hidden;
  }
  .confetti-piece{
    position:absolute; top:-5%; will-change: transform, opacity;
    animation: confettiFall linear forwards;
  }
  @keyframes confettiFall{
    to{ transform: translateY(110vh) rotate(var(--rot, 400deg)); opacity:.15; }
  }

  @media (prefers-reduced-motion: reduce){
    .drift, .glow-ring, .hub, .spin-btn::after, .confetti-piece, .orbit-ring{ animation: none !important; }
    canvas#wheel.spin-transition{ transition: transform 1.2s ease !important; }
  }

  footer{
    margin-top:34px; font-size:12px; color:var(--mauve-soft); opacity:.7; text-align:center;
  }
  footer a{ color:var(--mauve-soft); }

  /* side names — auto-scrolling list over the full screen height, fades just at
     the top/bottom edges; starts centered, scrolls only when the names overflow
     by at least one line, and disappears while the wheel rolls */
  .side-names{
    position: fixed; top: 0; right: 26px;
    width: min(240px, 24vw); height: 100vh;
    overflow: hidden; z-index: 10;
    opacity: 1; transition: opacity .45s ease;
    pointer-events: none;
    -webkit-mask-image: linear-gradient(to bottom, transparent 0, #000 44px, #000 calc(100% - 44px), transparent 100%);
    mask-image: linear-gradient(to bottom, transparent 0, #000 44px, #000 calc(100% - 44px), transparent 100%);
  }
  .side-names[hidden]{ display:none; }
  body.rolling .side-names{ opacity: 0; }
  .side-names .names-track{
    display:flex; flex-direction:column;
    animation: names-scroll linear infinite;
    will-change: transform;
  }
  .side-names .names-track.no-scroll{ animation:none; height:100%; justify-content:center; }
  .side-names .copy{ display:flex; flex-direction:column; gap: 22px; padding-bottom: 22px; }
  .side-names .nm{
    font-family:'Frank Ruhl Libre', serif; font-weight: 600;
    font-size: 21px; text-align:center; color: var(--mauve-soft);
    white-space: nowrap;
  }
  /* scroll starts with the list centered (first name at mid-screen) */
  @keyframes names-scroll{
    from{ transform: translateY(var(--names-start, 50vh)); }
    to{ transform: translateY(calc(var(--names-start, 50vh) - var(--names-period, 400px))); }
  }
  @media (max-width: 1100px){ .side-names{ display:none; } }
</style>
</head>

<script>
(function(){
  "use strict";

  // ---------------- Ambient background particles ----------------
  const ambient = document.getElementById('ambient');
  const glyphs = ['♥','♡','✦','✧','💎','♦'];
  const glyphColors = ['#E28BA0','#8FD3E8','#D9AF6E','#F4B9C6','#5FB4D2'];
  const N_PARTICLES = window.innerWidth < 700 ? 14 : 24;
  for(let i=0;i<N_PARTICLES;i++){
    const el = document.createElement('div');
    el.className = 'drift';
    el.textContent = glyphs[Math.floor(Math.random()*glyphs.length)];
    const size = 10 + Math.random()*22;
    el.style.fontSize = size + 'px';
    el.style.left = Math.random()*100 + 'vw';
    el.style.top = (100 + Math.random()*20) + 'vh';
    el.style.color = glyphColors[Math.floor(Math.random()*glyphColors.length)];
    el.style.setProperty('--dx', (Math.random()*80-40) + 'px');
    const dur = 16 + Math.random()*18;
    el.style.animationDuration = dur + 's, ' + (3+Math.random()*3) + 's';
    el.style.animationDelay = (-Math.random()*dur) + 's, ' + (-Math.random()*4) + 's';
    ambient.appendChild(el);
  }

  // ---------------- State ----------------
  const qs = new URLSearchParams(location.search);
  let names = [];
  try {
    // names travel via localStorage (shared across the file:// pages in Firefox);
    // sessionStorage remains as a fallback for older flows
    names = JSON.parse(localStorage.getItem('datelink-roulette-names') || '[]') || [];
    if (!names.length) names = JSON.parse(sessionStorage.getItem('datelink-roulette-names') || '[]') || [];
  } catch (e) {}

  // winners stay on the wheel after each pick (no removal)
  const removeWinner = false;
  const fast = qs.get('fast') === '1';
  const embed = qs.get('embed') === '1'; // shown inside the export page overlay
  const SIDE_NAMES_VISIBLE = false; // side list hidden for now — flip to true to re-enable
  const SPIN_DURATION_MS = fast ? 500 : 17000; // ~3x the original pace, feels intense and drawn-out

  const spinBtn = document.getElementById('spinBtn');
  const modalOverlay = document.getElementById('modalOverlay');
  const winnerNameEl = document.getElementById('winnerName');
  const winnerPhoneEl = document.getElementById('winnerPhone');
  const winnerPhoneNumEl = document.getElementById('winnerPhoneNum');
  const modalClose = document.getElementById('modalClose');
  const canvas = document.getElementById('wheel');
  const ctx = canvas.getContext('2d');
  const pointerReadout = document.getElementById('pointerReadout');
  const pointerReadoutText = document.getElementById('pointerReadoutText');

  const palette = [
    {fill:'#F4B9C6', text:'#6B2E42'},
    {fill:'#8FD3E8', text:'#1D4E5C'},
    {fill:'#F3DFB4', text:'#7A4B1E'},
    {fill:'#FBD7DF', text:'#8A4159'},
    {fill:'#C9EAF2', text:'#2B5C6B'},
    {fill:'#E8C99A', text:'#5E3E13'},
  ];

  let currentRotation = 0;
  let spinning = false;

  /* entries may arrive as plain strings (older storage/direct opens) or as
     {name, phone} objects (the export page overlay) — normalize once here */
  function normEntry(x){
    if (x && typeof x === 'object') return { name: String(x.name || ''), phone: String(x.phone || '') };
    return { name: String(x || ''), phone: '' };
  }

  function setNames(arr){
    names = (arr || []).map(normEntry);
    drawWheel();
    updateCount();
    if (SIDE_NAMES_VISIBLE) renderSideNames();
  }

  // ---------------- Side names list ----------------
  const sideNamesEl = document.getElementById('sideNames');
  const namesTrackEl = document.getElementById('namesTrack');
  function renderSideNames(){
    if(!names.length){ sideNamesEl.hidden = true; return; }
    sideNamesEl.hidden = false;
    namesTrackEl.innerHTML = '';
    for (var c = 0; c < 2; c++){ // two copies for a seamless loop
      var copy = document.createElement('div');
      copy.className = 'copy';
      names.forEach(function (nm){
        var d = document.createElement('div');
        d.className = 'nm';
        d.textContent = nm.name;
        copy.appendChild(d);
      });
      namesTrackEl.appendChild(copy);
    }
    namesTrackEl.style.animationDuration = Math.max(16, names.length * 2.2) + 's';
    // scroll only when the names overflow the full screen height by at least one
    // line; otherwise the list sits centered and still
    var period = namesTrackEl.scrollHeight / 2; // one copy incl. its trailing spacer
    var firstNm = namesTrackEl.querySelector('.nm');
    var lineH = firstNm ? firstNm.getBoundingClientRect().height + 22 : 0;
    var overflow = period - innerHeight >= lineH;
    namesTrackEl.classList.toggle('no-scroll', !overflow);
    if (overflow) {
      namesTrackEl.style.setProperty('--names-start', '50vh'); // begin centered
      namesTrackEl.style.setProperty('--names-period', period + 'px');
    }
  }

  function updateCount(){
    spinBtn.disabled = names.length < 2 || spinning;
  }

  // ---------------- Wheel drawing ----------------
  function drawWheel(){
    const size = canvas.width;
    const cx = size/2, cy = size/2;
    const radius = size/2 - 6;
    ctx.clearRect(0,0,size,size);

    if(names.length === 0){
      ctx.beginPath();
      ctx.arc(cx,cy,radius,0,Math.PI*2);
      ctx.fillStyle = '#FBEBE4';
      ctx.fill();
      ctx.font = '600 20px Assistant, sans-serif';
      ctx.fillStyle = '#C6A5B2';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText('אין מגישים להגרלה', cx, cy);
      return;
    }

    const n = names.length;
    const segAngle = (Math.PI*2) / n;

    for(let i=0;i<n;i++){
      const start = -Math.PI/2 + i*segAngle;
      const end = start + segAngle;
      const colorSet = palette[i % palette.length];

      // segment fill with subtle radial gradient
      const grad = ctx.createRadialGradient(cx,cy, radius*0.15, cx,cy, radius);
      grad.addColorStop(0, '#FFFDFB');
      grad.addColorStop(1, colorSet.fill);

      ctx.beginPath();
      ctx.moveTo(cx,cy);
      ctx.arc(cx,cy,radius,start,end);
      ctx.closePath();
      ctx.fillStyle = grad;
      ctx.fill();

      // gold divider
      ctx.strokeStyle = 'rgba(217,175,110,0.85)';
      ctx.lineWidth = Math.max(0.6, Math.min(2, 260/n));
      ctx.stroke();

      // label
      const mid = start + segAngle/2;
      ctx.save();
      ctx.translate(cx,cy);
      ctx.rotate(mid);
      ctx.textAlign = 'right';
      ctx.textBaseline = 'middle';
      ctx.fillStyle = colorSet.text;
      const fontSize = Math.max(9, Math.min(20, 240/n));
      ctx.font = '600 ' + fontSize + 'px Assistant, sans-serif';
      let label = names[i].name;
      const maxChars = n > 40 ? 5 : Math.max(6, Math.floor(18 - n*0.3));
      if(label.length > maxChars) label = label.slice(0,maxChars-1) + '…';
      ctx.fillText(label, radius - 14, 0);
      ctx.restore();
    }

    // outer thin gold ring
    ctx.beginPath();
    ctx.arc(cx,cy,radius,0,Math.PI*2);
    ctx.lineWidth = 3;
    ctx.strokeStyle = 'rgba(217,175,110,0.9)';
    ctx.stroke();
  }

  // ---------------- Spin logic ----------------
  const wheelWrap = document.querySelector('.wheel-wrap');

  function startSpinFX(){
    wheelWrap.classList.add('is-spinning');
    document.documentElement.style.setProperty('--spin-duration', (SPIN_DURATION_MS/1000) + 's');
  }

  function stopSpinFX(){
    wheelWrap.classList.remove('is-spinning');
  }

  function currentCanvasAngleDeg(){
    const style = getComputedStyle(canvas).transform;
    if(!style || style === 'none') return 0;
    const m = style.match(/matrix\(([^)]+)\)/);
    if(!m) return 0;
    const parts = m[1].split(',').map(Number);
    const a = parts[0], b = parts[1];
    return Math.atan2(b, a) * 180 / Math.PI;
  }

  let readoutLastIdx = -1;
  function readoutTick(){
    if(!spinning) return;
    const n = names.length;
    if(n > 0){
      const norm = ((currentCanvasAngleDeg() % 360) + 360) % 360;
      const segAngleDeg = 360 / n;
      const topOriginal = ((360 - norm) + 360) % 360;
      let idx = Math.floor(topOriginal / segAngleDeg);
      if(idx >= n) idx = n - 1;
      if(idx !== readoutLastIdx){
        readoutLastIdx = idx;
        pointerReadoutText.textContent = names[idx].name;
        pointerReadoutText.classList.remove('tick');
        void pointerReadoutText.offsetWidth;
        pointerReadoutText.classList.add('tick');
      }
    }
    requestAnimationFrame(readoutTick);
  }

  function spin(){
    if(spinning || names.length < 2) return;
    spinning = true;
    document.body.classList.add('rolling'); // fade the side list out while rolling
    spinBtn.disabled = true;
    startSpinFX();

    readoutLastIdx = -1;
    pointerReadoutText.textContent = names[0] ? names[0].name : '';
    pointerReadout.classList.add('show');
    spinBtn.classList.add('is-hidden');
    requestAnimationFrame(readoutTick);

    const n = names.length;
    const segAngleDeg = 360 / n;
    const winnerIndex = Math.floor(Math.random()*n);

    // mid-angle of winner segment in canvas terms (0 = top, clockwise)
    const originalMidDeg = winnerIndex*segAngleDeg + segAngleDeg/2;
    // small jitter within the segment for realism
    const jitter = (Math.random()-0.5) * (segAngleDeg*0.6);
    const targetMid = originalMidDeg + jitter;

    const currentMod = ((currentRotation % 360) + 360) % 360;
    const neededForward = ((360 - targetMid) - currentMod + 360*2) % 360;
    const extraSpins = 18 + Math.floor(Math.random()*6); // 18-23 full spins, long and dramatic
    const nextRotation = currentRotation + extraSpins*360 + neededForward;

    canvas.classList.add('spin-transition');
    canvas.style.transform = 'rotate(' + nextRotation + 'deg)';

    const onEnd = function(){
      canvas.removeEventListener('transitionend', onEnd);
      currentRotation = nextRotation;
      spinning = false;
      document.body.classList.remove('rolling'); // side list fades back in
      stopSpinFX();
      pointerReadout.classList.remove('show');
      spinBtn.classList.remove('is-hidden');
      announceWinner(winnerIndex);
    };
    canvas.addEventListener('transitionend', onEnd);
  }

  function announceWinner(index){
    const winner = names[index];
    showModal(winner);
    burstConfetti();

    if(removeWinner){
      names.splice(index,1);
      updateCount();
      // reset wheel rotation cleanly for the new (smaller) segment count
      setTimeout(()=>{
        canvas.classList.remove('spin-transition');
        currentRotation = 0;
        canvas.style.transform = 'rotate(0deg)';
        drawWheel();
      }, 650);
    } else {
      updateCount();
    }
  }

  function showModal(entry){
    winnerNameEl.textContent = entry.name;
    winnerPhoneNumEl.textContent = entry.phone;
    winnerPhoneEl.classList.remove('copied');
    winnerPhoneEl.hidden = !entry.phone;
    modalOverlay.classList.add('show');
  }
  modalClose.onclick = ()=> modalOverlay.classList.remove('show');
  modalOverlay.onclick = (e)=>{ if(e.target === modalOverlay) modalOverlay.classList.remove('show'); };

  /* clicking the phone copies it — plain text, no button look; the copy icon
     briefly becomes a checkmark as feedback */
  function copyPhoneToClipboard(text){
    if (navigator.clipboard && window.isSecureContext) {
      return navigator.clipboard.writeText(text).catch(function () { return legacyCopy(text); });
    }
    return Promise.resolve(legacyCopy(text));
  }
  function legacyCopy(text){
    var ta = document.createElement('textarea');
    ta.value = text;
    ta.setAttribute('readonly', '');
    ta.style.position = 'fixed';
    ta.style.opacity = '0';
    document.body.appendChild(ta);
    ta.select();
    var ok = false;
    try { ok = document.execCommand('copy'); } catch (e) {}
    ta.remove();
    return ok;
  }
  winnerPhoneEl.addEventListener('click', function () {
    var p = winnerPhoneNumEl.textContent.trim();
    if (!p) return;
    copyPhoneToClipboard(p);
    winnerPhoneEl.classList.add('copied');
    clearTimeout(winnerPhoneEl._t);
    winnerPhoneEl._t = setTimeout(function () { winnerPhoneEl.classList.remove('copied'); }, 1200);
  });

  function burstConfetti(){
    const layer = document.getElementById('confetti-layer');
    const colors = ['#E28BA0','#8FD3E8','#D9AF6E','#F4B9C6','#F3DFB4'];
    const shapes = ['♥','✦','●','♦'];
    const count = 60;
    for(let i=0;i<count;i++){
      const piece = document.createElement('div');
      piece.className = 'confetti-piece';
      piece.textContent = shapes[Math.floor(Math.random()*shapes.length)];
      piece.style.left = Math.random()*100 + 'vw';
      piece.style.fontSize = (10 + Math.random()*16) + 'px';
      piece.style.color = colors[Math.floor(Math.random()*colors.length)];
      const dur = 2.4 + Math.random()*1.8;
      piece.style.animationDuration = dur + 's';
      piece.style.animationDelay = (Math.random()*0.4) + 's';
      piece.style.setProperty('--rot', (Math.random()*600-300)+'deg');
      layer.appendChild(piece);
      setTimeout(()=> piece.remove(), (dur+0.6)*1000);
    }
  }

  // when embedded in the export page, the names arrive over postMessage
  // (storage may be isolated per file:// page); the parent asks for them on load
  window.addEventListener('message', function (ev) {
    const d = ev.data;
    if (d && d.type === 'datelink-names' && Array.isArray(d.names)) setNames(d.names);
  });
  if (embed && window.parent !== window) {
    try { window.parent.postMessage({ type: 'datelink-ready' }, '*'); } catch (e) {}
    window.addEventListener('keydown', function (e) {
      if (e.key === 'Escape' && !modalOverlay.classList.contains('show')) {
        try { window.parent.postMessage({ type: 'datelink-close' }, '*'); } catch (err) {}
      }
    });
    const footerEl = document.querySelector('footer');
    if (footerEl) footerEl.hidden = true; // the overlay has its own close button
  }

  spinBtn.onclick = spin;

  window.addEventListener('resize', ()=>{ /* canvas is fixed-resolution, CSS scales it responsively */ });

  // init
  setNames(names);
})();
</script>
</body>
</html>
