    <section class="panel">
      <label class="field">שם מלא
        <input id="f-name" type="text" autocomplete="name" placeholder="לדוגמה: אבי ישראלי">
      </label>
      <div class="hint" id="hint-name">יש להזין שם מלא</div>

      <label class="field">מספר פלאפון
        <input id="f-phone" type="tel" autocomplete="tel" dir="rtl" placeholder="לדוגמה: 050-1234567">
      </label>
      <div class="hint" id="hint-phone">יש להזין מספר פלאפון תקין (לפחות 9 ספרות)</div>

      <div class="actions">
        <button id="b-copy" class="btn">העתק קישור</button>
        <button id="b-share" class="btn icon-btn" type="button" title="שיתוף">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M18 16.08c-.76 0-1.44.3-1.96.77L8.91 12.7c.05-.23.09-.46.09-.7s-.04-.47-.09-.7l7.05-4.11c.54.5 1.25.81 2.04.81 1.66 0 3-1.34 3-3s-1.34-3-3-3-3 1.34-3 3c0 .24.04.47.09.7L8.04 9.81C7.5 9.31 6.79 9 6 9c-1.66 0-3 1.34-3 3s1.34 3 3 3c.79 0 1.5-.31 2.04-.81l7.12 4.16c-.05.21-.08.43-.08.65 0 1.61 1.31 2.92 2.92 2.92 1.61 0 2.92-1.31 2.92-2.92s-1.31-2.92-2.92-2.92z"/></svg>
        </button>
        <button id="b-whatsapp" class="btn icon-btn" type="button" title="שיתוף בוואטסאפ">

      </div>
    </section>

    <p class="share-note">זה הקישור האישי שלכם 👆<br>
שלחו אותו לבחורים מישיבות הסדר, מכינות ולבחורים דתיים לאומיים תורניים, וככה הם יירשמו למיזם דרככם.</p>
  </main>

  <div id="toast" class="toast" hidden></div>

  <script src="app.js"></script>
  <script>
    (function () {
      var T = window.Tools;
      var nameEl = document.getElementById('f-name');
      var phoneEl = document.getElementById('f-phone');
      var noteEl = document.querySelector('.share-note');

      /* which form this share page feeds: /b → boys form, anywhere else → girls.
     Both routes serve this same page (see b/). */
  var FORM = /\/b(?:\/|$)/.test(location.pathname) ? 'boys' : 'girls';

  function validate() {
        var nameOk = nameEl.value.trim().length >= 2;
        var digits = (phoneEl.value || '').replace(/\D/g, '');
        var phoneOk = digits.length >= 9;
        document.getElementById('hint-name').classList.toggle('show', !nameOk && nameEl.value.trim() !== '');
        document.getElementById('hint-phone').classList.toggle('show', !phoneOk && phoneEl.value.trim() !== '');
        if (!nameOk) { document.getElementById('hint-name').classList.add('show'); nameEl.focus(); return null; }
        if (!phoneOk) { document.getElementById('hint-phone').classList.add('show'); phoneEl.focus(); return null; }
        return T.buildFormLink(nameEl.value, phoneEl.value, FORM);
      }

      // the short /sh link (blank page that redirects to the form) is what we
      // show and share
      function shortLink() { return T.buildShareUrl(nameEl.value, phoneEl.value, undefined, FORM); }

      document.getElementById('b-copy').addEventListener('click', function () {
        if (!validate()) return;
        noteEl.classList.add('show');
        T.copyText(T.buildShareText(shortLink())).then(function (ok) {
          if (ok) T.showToast('✓ הטקסט הועתק!');
          else T.showToast('לא הצלחנו להעתיק אוטומטית — נסה שוב', true);
        });
      });

      // system share: only available on some platforms (not desktop Firefox) —
      // hide the button entirely when the API is missing
      document.getElementById('b-share').addEventListener('click', function () {
        if (!validate()) return;
        navigator.share({ title: 'מיזם השידוכים וְאֵרַשְׂתִּיךְ', text: T.buildShareText(shortLink()) }).catch(function () {});
      });
      if (!navigator.share) document.getElementById('b-share').hidden = true;

      document.getElementById('b-whatsapp').addEventListener('click', function () {
        if (!validate()) return;
        window.open('https://wa.me/?text=' + encodeURIComponent(T.buildShareText(shortLink())), '_blank', 'noopener');
      });

      [nameEl, phoneEl].forEach(function (el) {
        el.addEventListener('input', function () {
          document.getElementById('hint-name').classList.remove('show');
          document.getElementById('hint-phone').classList.remove('show');
        });
      });

      // keep the icon buttons square next to the (taller) copy button: the flex
      // row stretches their height, so mirror it back into the width
      function syncIconBtns() {
        document.querySelectorAll('.btn.icon-btn').forEach(function (b) {
          b.style.width = Math.round(b.getBoundingClientRect().height) + 'px';
        });
      }
      syncIconBtns();
      window.addEventListener('resize', syncIconBtns);
    })();
  </script>
